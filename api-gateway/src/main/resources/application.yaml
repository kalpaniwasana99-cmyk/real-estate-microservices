server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://127.0.0.1:5500"
              - "http://localhost:5500"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user-auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: property-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/properties/**
          filters:
            - AddRequestHeader=X-API-KEY, my-super-secret-property-api-key

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always