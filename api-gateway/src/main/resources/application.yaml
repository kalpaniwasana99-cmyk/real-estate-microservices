server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

  data:
    redis:
      host: localhost
      port: 6379

# Spring Security මඟින් 401 ඒම වැළැක්වීම සඳහා මෙය එකතු කරන්න
management:
  endpoints:
    web:
    exposure:
      include: '*'
  endpoint:
    health:
      show-details: always

# Spring Security ඩීෆෝල්ට් පාස්වර්ඩ් එක ඉවත් කිරීම සඳහා
spring.security.oauth2:
  resourceserver:
    jwt:
      issuer-uri: ~