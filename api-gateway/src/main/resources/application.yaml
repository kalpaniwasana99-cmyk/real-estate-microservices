server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://127.0.0.1:5500"
              - "http://localhost:5500"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user-auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: property-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/properties/**

        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/payments/**

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notify/**

        - id: inquiry-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/inquiries/**

# Redis එක Local නැත්නම් දෝෂ එන නිසා දැනට Comment කර ඇත
