version: '3.8'

services:
  
  redis:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    restart: always

  
  mongodb:
    image: mongo:latest
    container_name: mongodb-container
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  
  property-service:
    build:
      context: ./property-service
      dockerfile: Dockerfile
    container_name: property-service
    ports:
      - "8082:8082"
    depends_on:
      - mongodb
    environment:
      
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/real_estate_db

  
  frontend-client:
    build:
      context: ./frontend-client
      dockerfile: Dockerfile
    container_name: frontend-client
    ports:
      - "3000:80"
    depends_on:
      - property-service

volumes:
  mongo_data: