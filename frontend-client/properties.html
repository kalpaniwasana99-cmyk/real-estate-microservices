<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Properties - Dream Estates</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }
        body { background-color: #060f26; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        nav { width: 100%; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; background: #0b1221; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 100; }
        .logo { font-size: 24px; font-weight: 700; color: #ffffff; }
        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a { color: #cccccc; text-decoration: none; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .nav-links a.active, .nav-links a:hover { color: #ffd700; }
        .logout-nav-btn { padding: 8px 20px; background: transparent; color: #e53e3e; border: 1px solid #e53e3e; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .logout-nav-btn:hover { background: #e53e3e; color: white; }
        
        .container { padding: 40px 50px; max-width: 1200px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 30px; }
        .list-card { background: #0b1221; padding: 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        .section-title { font-size: 18px; font-weight: 600; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px; border-left: 3px solid #1877f2; padding-left: 15px; }
        
        .property-grid-explore { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .property-card-banner { background: #111b33; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s, border-color 0.3s; cursor: pointer; position: relative; }
        .property-card-banner:hover { transform: translateY(-5px); border-color: rgba(24, 119, 242, 0.6); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        
        .property-img { width: 100%; height: 200px; object-fit: cover; background: #1f2937; }
        .property-card-content { padding: 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .property-card-content h4 { color: #ffd700; font-size: 18px; }
        .property-card-content p { color: #a8b2d1; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .property-price { font-weight: 600; color: #34a853; font-size: 18px; margin-top: auto; }
        .property-location { font-size: 13px; color: #cbd5e1; }
        .explore-action-hint { padding: 12px; background: rgba(24, 119, 242, 0.1); color: #1877f2; text-align: center; font-size: 13px; font-weight: 600; border-top: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <nav>
        <div class="logo">DREAM ESTATES</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="properties.html" class="active">Explore Properties</a>
            <a href="my-properties.html">My Dashboard</a>
            <a href="profile.html">Profile</a>
        </div>
        <div class="nav-right" style="display: flex; align-items: center; gap: 25px;">
            <a href="notifications.html" style="display:flex; align-items:center; color: #cccccc; text-decoration: none; transition: color 0.3s;" title="Notifications">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
            </a>
            <button class="logout-nav-btn" id="logoutBtn">SIGN OUT</button>
        </div>
    </nav>

    <div class="container">
        <div class="list-card">
            <div class="section-title">All Available Properties</div>
            <div class="property-grid-explore" id="explorePropertyGrid">
                <p style="color: #a8b2d1; text-align: center; grid-column: span 3; margin: 40px 0;">Loading properties...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8082/api/properties';

        window.addEventListener('DOMContentLoaded', () => {
            loadExploreProperties();
        });

        async function loadExploreProperties() {
            const grid = document.getElementById('explorePropertyGrid');
            try {
                const response = await fetch(API_BASE_URL, {
                    method: 'GET'
                });

                if (response.ok) {
                    const data = await response.json();
                    let properties = [];
                    if (Array.isArray(data)) {
                        properties = data;
                    } else if (data && Array.isArray(data.content)) {
                        properties = data.content;
                    } else if (data) {
                        properties = [data];
                    }

                    if (properties.length === 0) {
                        grid.innerHTML = '<p style="color: #a8b2d1; text-align: center; grid-column: span 3; margin: 40px 0;">No properties available at the moment.</p>';
                        return;
                    }

                    let html = '';
                    properties.forEach(p => {
                        const propId = p.id || p._id;
                        const priceVal = p.price ? p.price.toLocaleString() : '0';
                        let imageHtml = p.imageUrl 
                            ? `<img src="http://localhost:8082/api/properties/uploads/${p.imageUrl}" class="property-img" alt="${p.title}">` 
                            : `<div class="property-img" style="display:flex;align-items:center;justify-content:center;color:#a8b2d1;">No Image</div>`;

                        html += `
                            <div class="property-card-banner" onclick="window.location.href='payment-inquiry.html?propertyId=${propId}'">
                                ${imageHtml}
                                <div class="property-card-content">
                                    <h4>${p.title || 'Untitled'}</h4>
                                    <p>${p.description || ''}</p>
                                    <div class="property-location">📍 ${p.location || 'N/A'}</div>
                                    <div class="property-price">$${priceVal}</div>
                                </div>
                                <div class="explore-action-hint">Click to Inquiry & Pay &rarr;</div>
                            </div>
                        `;
                    });
                    grid.innerHTML = html;
                } else {
                    grid.innerHTML = '<p style="color: #e53e3e; text-align: center; grid-column: span 3; margin: 40px 0;">Failed to load properties.</p>';
                }
            } catch (error) {
                grid.innerHTML = '<p style="color: #e53e3e; text-align: center; grid-column: span 3; margin: 40px 0;">Connection error to server.</p>';
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
