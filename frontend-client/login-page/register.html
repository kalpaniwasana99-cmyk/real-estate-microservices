<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Portal - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #ece9e6 0%, #ffffff 100%); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .mobile-screen { background-color: #ffffff; width: 375px; height: 700px; border-radius: 40px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15), inset 0 0 0 8px #f1f1f1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .header-image { background: url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80') center/cover no-repeat; height: 28%; position: relative; }
        .header-image::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.7)); }
        .app-logo { position: absolute; bottom: 15px; left: 25px; color: #ffffff; z-index: 2; font-size: 24px; font-weight: 700; line-height: 1.2; }
        .register-content { padding: 25px 25px; flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .register-content h2 { color: #1a1a1a; font-size: 22px; font-weight: 600; margin-bottom: 3px; }
        .register-content p { color: #888; font-size: 12px; margin-bottom: 20px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; margin-bottom: 5px; color: #444; font-size: 12px; font-weight: 500; }
        .input-group input { width: 100%; padding: 11px 14px; border: 1.5px solid #e1e5ee; border-radius: 12px; font-size: 13px; outline: none; background-color: #f8f9fa; transition: all 0.3s ease; }
        .input-group input:focus { border-color: #1a1a1a; background-color: #ffffff; box-shadow: 0 0 0 4px rgba(26, 26, 26, 0.1); }
        .register-btn { width: 100%; padding: 13px; background: #1a1a1a; color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.3s, transform 0.2s; margin-top: 5px; box-shadow: 0 8px 20px rgba(26, 26, 26, 0.3); }
        .register-btn:hover { background: #333333; transform: translateY(-2px); }
        .signin-link { text-align: center; margin-top: auto; font-size: 12px; color: #666; padding-top: 10px; }
        .signin-link a { color: #1a1a1a; text-decoration: none; font-weight: 600; }
        .signin-link a:hover { text-decoration: underline; }

        /* --- CUSTOM POPUP MODAL --- */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: #ffffff; width: 85%; padding: 30px 20px; border-radius: 24px; text-align: center; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-icon { width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; margin: 0 auto 15px auto; font-weight: 700; }
        .modal-icon.success { background: #e6f4ea; color: #34a853; }
        .modal-icon.error { background: #ffebee; color: #d32f2f; }
        .modal-box h4 { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
        .modal-box p { font-size: 14px; color: #666; margin-bottom: 25px; }
        .modal-btn { width: 100%; padding: 14px; background: #1a1a1a; color: white; border: none; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .modal-btn:hover { background: #333333; }
    </style>
</head>
<body>
    <div class="mobile-screen">
        <div class="header-image"><div class="app-logo">Dream<br>Estates.</div></div>
        <div class="register-content">
            <h2>Create Account</h2>
            <p>Join Dream Estates today.</p>
            <form id="registerForm">
                <div class="input-group">
                    <label>First Name</label>
                    <input type="text" id="firstName" required placeholder="Wasana">
                </div>
                <div class="input-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName" required placeholder="Kalpani">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="register-btn">Sign Up</button>
            </form>
            <div class="signin-link">Already have an account? <a href="index.html">Sign in</a></div>
        </div>

        <!-- Popup Modal -->
        <div class="modal-overlay" id="customModal">
            <div class="modal-box">
                <div class="modal-icon" id="modalIcon">✓</div>
                <h4 id="modalTitle">Success!</h4>
                <p id="modalMessage">Operation successful.</p>
                <button class="modal-btn" id="modalOkBtn">OK</button>
            </div>
        </div>
    </div>

    <script>
        function showPopup(type, title, message, callback) {
            const modal = document.getElementById('customModal');
            const icon = document.getElementById('modalIcon');
            
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            
            icon.className = 'modal-icon ' + type;
            icon.innerText = type === 'success' ? '✓' : '✕';
            
            modal.classList.add('active');

            const okBtn = document.getElementById('modalOkBtn');
            const newOkBtn = okBtn.cloneNode(true);
            okBtn.parentNode.replaceChild(newOkBtn, okBtn);

            newOkBtn.addEventListener('click', () => {
                modal.classList.remove('active');
                if (callback) callback();
            });
        }

        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault(); 
            const userData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: "USER"
            };

            try {
                const response = await fetch('http://localhost:8080/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    showPopup('success', 'Success!', 'Registration Successful! Please login.', () => {
                        window.location.href = 'index.html';
                    });
                } else {
                    showPopup('error', 'Registration Failed', 'This email is already in use or invalid.');
                }
            } catch (error) {
                showPopup('error', 'Connection Error', 'Backend is down or unreachable.');
            }
        });
    </script>
</body>
</html>
