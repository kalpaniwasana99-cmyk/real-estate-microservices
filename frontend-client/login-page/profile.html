<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Dream Estates</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #ece9e6 0%, #ffffff 100%); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .mobile-screen { background-color: #ffffff; width: 380px; height: 720px; border-radius: 45px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2), inset 0 0 0 10px #1a1a1a; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .profile-header { background: linear-gradient(135deg, #1a1a1a, #333333); height: 30%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; position: relative; border-bottom-left-radius: 35px; border-bottom-right-radius: 35px; padding: 20px; text-align: center; flex-shrink: 0; }
        .avatar { width: 75px; height: 75px; background-color: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); color: #ffffff; border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; font-weight: 700; margin-bottom: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .profile-header h3 { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
        .profile-header span { font-size: 12px; color: rgba(255, 255, 255, 0.75); margin-top: 2px; }
        .profile-content { padding: 25px 25px; flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .section-title { font-size: 13px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; margin-bottom: 5px; color: #444; font-size: 12px; font-weight: 500; }
        .input-group input { width: 100%; padding: 11px 14px; border: 1.5px solid #e1e5ee; border-radius: 14px; font-size: 13px; outline: none; background-color: #f8f9fa; color: #333; transition: all 0.3s ease; }
        .input-group input:focus { border-color: #1a1a1a; background-color: #ffffff; box-shadow: 0 0 0 4px rgba(26, 26, 26, 0.1); }
        .update-btn { width: 100%; padding: 13px; background: #1a1a1a; color: white; border: none; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 5px; box-shadow: 0 8px 20px rgba(26, 26, 26, 0.3); transition: transform 0.2s, box-shadow 0.2s, background 0.3s; }
        .update-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 25px rgba(26, 26, 26, 0.4); background: #333333; }
        .delete-btn { width: 100%; padding: 11px; background: #fff5f5; color: #e53e3e; border: 1.5px solid #fed7d7; border-radius: 14px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.3s; }
        .delete-btn:hover { background: #ffe3e3; }
        .logout-btn { width: 100%; padding: 8px; background: transparent; color: #718096; border: none; font-size: 13px; cursor: pointer; margin-top: 10px; text-align: center; font-weight: 500; transition: color 0.2s; }
        .logout-btn:hover { color: #2d3748; text-decoration: underline; }

        /* --- CUSTOM POPUP MODAL --- */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: #ffffff; width: 85%; padding: 30px 20px; border-radius: 24px; text-align: center; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-icon { width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; margin: 0 auto 15px auto; font-weight: 700; }
        .modal-icon.success { background: #e6f4ea; color: #34a853; }
        .modal-icon.error { background: #ffebee; color: #d32f2f; }
        .modal-icon.warning { background: #fff8e1; color: #fbc02d; }
        .modal-box h4 { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
        .modal-box p { font-size: 14px; color: #666; margin-bottom: 25px; line-height: 1.5; }
        .modal-btn-group { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 14px; background: #1a1a1a; color: white; border: none; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .modal-btn:hover { background: #333333; }
        .modal-btn.cancel-btn { background: #f1f1f1; color: #333; }
        .modal-btn.cancel-btn:hover { background: #e1e1e1; }
    </style>
</head>
<body>

    <div class="mobile-screen">
        <div class="profile-header">
            <div class="avatar" id="userAvatar">U</div>
            <h3 id="headerName">Loading...</h3>
            <span id="headerEmail">please wait</span>
        </div>

        <div class="profile-content">
            <div class="section-title">Personal Information</div>
            <form id="profileForm">
                <div class="input-group">
                    <label>First Name</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="input-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName" required>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required>
                </div>
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="text" id="phone" placeholder="+94 7X XXX XXXX">
                </div>
                <div class="input-group">
                    <label>Address</label>
                    <input type="text" id="address" placeholder="123, Main Street, Colombo">
                </div>
                
                <button type="submit" class="update-btn">Save Changes</button>
                <button type="button" class="delete-btn" id="deleteBtn">Delete Account</button>
            </form>

            <button class="logout-btn" id="logoutBtn">Sign Out</button>
        </div>

        <div class="modal-overlay" id="customModal">
            <div class="modal-box">
                <div class="modal-icon" id="modalIcon">✓</div>
                <h4 id="modalTitle">Success!</h4>
                <p id="modalMessage">Operation successful.</p>
                <div class="modal-btn-group" id="modalBtnGroup"></div>
            </div>
        </div>
    </div>

    <script>
        function showPopup(type, title, message, onOk, showCancel = false) {
            const modal = document.getElementById('customModal');
            const icon = document.getElementById('modalIcon');
            const btnGroup = document.getElementById('modalBtnGroup');
            
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            
            icon.className = 'modal-icon ' + type;
            if (type === 'success') icon.innerText = '✓';
            else if (type === 'error') icon.innerText = '✕';
            else if (type === 'warning') icon.innerText = '!';

            btnGroup.innerHTML = ''; 
            
            if (showCancel) {
                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'modal-btn cancel-btn';
                cancelBtn.innerText = 'Cancel';
                cancelBtn.onclick = () => modal.classList.remove('active');
                btnGroup.appendChild(cancelBtn);
            }

            const okBtn = document.createElement('button');
            okBtn.className = 'modal-btn';
            okBtn.innerText = showCancel ? 'Delete' : 'OK';
            okBtn.onclick = () => {
                modal.classList.remove('active');
                if (onOk) onOk();
            };
            btnGroup.appendChild(okBtn);

            modal.classList.add('active');
        }

        // Fetch User Data on Load (GET)
        window.addEventListener('DOMContentLoaded', async () => {
            const userId = localStorage.getItem('userId');
            const token = localStorage.getItem('authToken');
            
            if (!userId || userId === 'null' || userId === 'undefined') {
                window.location.href = 'index.html';
                return;
            }

            try {
                const response = await fetch(`http://localhost:8080/auth/users/${userId}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('firstName').value = user.firstName || '';
                    document.getElementById('lastName').value = user.lastName || '';
                    document.getElementById('email').value = user.email || '';
                    document.getElementById('phone').value = user.phone || '';       // Phone Load කිරීම
                    document.getElementById('address').value = user.address || '';   // Address Load කිරීම
                    
                    const fullName = `${user.firstName || ''} ${user.lastName || ''}`.trim();
                    document.getElementById('headerName').innerText = fullName || 'User Account';
                    document.getElementById('headerEmail').innerText = user.email || '';

                    if(user.firstName) {
                        document.getElementById('userAvatar').innerText = user.firstName.charAt(0).toUpperCase();
                    }
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });

        // Update Profile Data (PUT)
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = localStorage.getItem('userId');
            const token = localStorage.getItem('authToken');

            const updatedData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,       // Phone යැවීම
                address: document.getElementById('address').value   // Address යැවීම
            };

            try {
                const response = await fetch(`http://localhost:8080/auth/users/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(updatedData)
                });

                if (response.ok) {
                    showPopup('success', 'Success!', 'Profile updated successfully!', () => {
                        document.getElementById('headerName').innerText = `${updatedData.firstName} ${updatedData.lastName}`;
                        document.getElementById('headerEmail').innerText = updatedData.email;
                        if(updatedData.firstName) document.getElementById('userAvatar').innerText = updatedData.firstName.charAt(0).toUpperCase();
                    });
                } else {
                    showPopup('error', 'Update Failed', 'Could not update profile information.');
                }
            } catch (error) {
                showPopup('error', 'Connection Error', 'Could not connect to server.');
            }
        });

        // Delete Account (DELETE)
        document.getElementById('deleteBtn').addEventListener('click', () => {
            showPopup('warning', 'Are you sure?', 'Do you really want to delete your account? This action cannot be undone.', async () => {
                const userId = localStorage.getItem('userId');
                const token = localStorage.getItem('authToken');

                try {
                    const response = await fetch(`http://localhost:8080/auth/users/${userId}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (response.ok) {
                        showPopup('success', 'Deleted!', 'Account deleted successfully.', () => {
                            localStorage.clear();
                            window.location.href = 'index.html';
                        });
                    } else {
                        showPopup('error', 'Error', 'Failed to delete account.');
                    }
                } catch (error) {
                    showPopup('error', 'Connection Error', 'Could not connect to server.');
                }
            }, true);
        });

        // Sign Out
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
