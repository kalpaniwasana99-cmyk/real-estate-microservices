<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Portal - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .mobile-screen {
            background-color: #ffffff;
            width: 375px; 
            height: 700px; 
            border-radius: 40px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15), inset 0 0 0 8px #f1f1f1; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .header-image {
            background: url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80') center/cover no-repeat;
            height: 35%;
            position: relative;
        }

        .header-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.7));
        }

        .app-logo {
            position: absolute;
            bottom: 20px;
            left: 25px;
            color: #ffffff;
            z-index: 2;
            font-size: 26px;
            font-weight: 700;
            line-height: 1.2;
        }

        .login-content {
            padding: 35px 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .login-content h2 {
            color: #1a1a1a;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .login-content p {
            color: #888;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-size: 13px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e1e5ee;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background-color: #f8f9fa;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #2b5cff;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(43, 92, 255, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: #2b5cff;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(43, 92, 255, 0.3);
        }

        .login-btn:hover {
            background: #1a47df;
            transform: translateY(-2px);
        }

        .error-message {
            color: #d32f2f;
            background-color: #ffebee;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            margin-top: 20px;
            display: none;
            font-weight: 500;
        }

        .signup-link {
            text-align: center;
            margin-top: auto;
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }

        .signup-link a {
            color: #2b5cff;
            text-decoration: none;
            font-weight: 600;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="mobile-screen">
        <div class="header-image">
            <div class="app-logo">Dream<br>Estates.</div>
        </div>

        <div class="login-content">
            <h2>Welcome Back</h2>
            <p>Please enter your details to sign in.</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="login-btn">Sign In</button>
                
                <div class="error-message" id="errorMessage">Server error. Please make sure backend is running.</div>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="register.html">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault(); 

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            errorMessage.style.display = 'none'; 

            try {
                const response = await fetch('http://localhost:8080/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email, password: password })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // 1. අතිශය වැදගත්: බ්‍රවුසරයේ ඇති පැරණි දෝෂ සහිත දත්ත සියල්ල මකා දැමීම
                    localStorage.clear();
                    
                    if(data.token) {
                        localStorage.setItem('authToken', data.token);
                    }
                    
                    // 2. User ID එක නිවැරදිව ලබා ගැනීම (MongoDB හි id හෝ _id යන දෙකෙන්ම පරීක්ෂා කිරීම)
                    const currentUserId = (data.user && data.user.id) ? data.user.id : (data.user && data.user._id) ? data.user._id : null;
                    
                    if(currentUserId) {
                        localStorage.setItem('userId', currentUserId);
                    }
                    
                    alert('Login Successful! Welcome to Dream Estates.');
                    window.location.href = 'profile.html';
                    
                } else {
                    errorMessage.textContent = 'ඊමේල් ලිපිනය හෝ මුරපදය වැරදියි!';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = 'Connection failed! CORS blocked or Backend is down.';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
