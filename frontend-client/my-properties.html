<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Properties - Dream Estates</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }
        body { background-color: #060f26; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        nav { width: 100%; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; background: #0b1221; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 100; }
        .logo { font-size: 24px; font-weight: 700; color: #ffffff; }
        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a { color: #cccccc; text-decoration: none; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .nav-links a.active, .nav-links a:hover { color: #ffd700; }
        .logout-nav-btn { padding: 8px 20px; background: transparent; color: #e53e3e; border: 1px solid #e53e3e; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .logout-nav-btn:hover { background: #e53e3e; color: white; }
        .container { padding: 40px 50px; max-width: 900px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 30px; }
        .top-action-bar { display: flex; justify-content: space-between; align-items: center; background: #0b1221; padding: 25px 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .top-action-bar h2 { font-size: 20px; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; }
        .add-property-toggle-btn { padding: 12px 25px; background: #1877f2; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .add-property-toggle-btn:hover { background: #145dbf; }
        .list-card { background: #0b1221; padding: 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        .section-title { font-size: 18px; font-weight: 600; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px; border-left: 3px solid #1877f2; padding-left: 15px; }
        .property-grid { display: flex; flex-direction: column; gap: 20px; max-height: 700px; overflow-y: auto; padding-right: 5px; }
        .property-item { background: #111b33; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); padding: 25px; display: flex; flex-direction: column; gap: 10px; transition: transform 0.2s, border-color 0.2s; position: relative; }
        .property-item:hover { transform: translateY(-2px); border-color: rgba(24, 119, 242, 0.4); }
        .property-item h4 { color: #ffd700; font-size: 20px; }
        .property-item p { color: #a8b2d1; font-size: 14px; }
        .property-price { font-weight: 600; color: #34a853; font-size: 18px; margin-top: 5px; }
        .property-actions { display: flex; gap: 10px; margin-top: 15px; }
        .edit-btn { padding: 6px 15px; background: #f0ad4e; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .edit-btn:hover { background: #ec971f; }
        .delete-btn { padding: 6px 15px; background: #e53e3e; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .delete-btn:hover { background: #c53030; }
        .property-contacts { margin-top: 10px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; gap: 25px; font-size: 13px; color: #cbd5e1; }
        .property-contacts span { display: flex; align-items: center; gap: 6px; }
        .form-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .form-modal-overlay.active { opacity: 1; visibility: visible; }
        .form-modal-box { background: #0b1221; width: 500px; max-height: 90vh; overflow-y: auto; padding: 35px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); transform: scale(0.8); transition: transform 0.3s; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .form-modal-overlay.active .form-modal-box { transform: scale(1); }
        .close-modal-btn { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: #a8b2d1; font-size: 22px; cursor: pointer; transition: color 0.3s; }
        .close-modal-btn:hover { color: #ffffff; }
        .input-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        .input-group label { margin-bottom: 8px; color: #a8b2d1; font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
        .input-group input, .input-group textarea { padding: 12px 15px; border: 1px solid #1f2937; border-radius: 8px; font-size: 14px; outline: none; background-color: #111b33; color: white; transition: all 0.3s ease; }
        .input-group input:focus, .input-group textarea:focus { border-color: #ffd700; box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1); }
        .submit-btn { width: 100%; padding: 14px; background: #1877f2; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .submit-btn:hover { background: #145dbf; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 1100; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: #111b33; width: 400px; padding: 40px 30px; border-radius: 20px; text-align: center; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); transform: scale(0.8); transition: transform 0.3s; border: 1px solid rgba(255,255,255,0.1); }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-icon { width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 35px; margin: 0 auto 20px auto; font-weight: 700; }
        .modal-icon.success { background: rgba(52, 168, 83, 0.1); color: #34a853; border: 2px solid #34a853; }
        .modal-icon.error { background: rgba(211, 47, 47, 0.1); color: #d32f2f; border: 2px solid #d32f2f; }
        .modal-box h4 { font-size: 22px; font-weight: 600; color: #ffffff; margin-bottom: 10px; }
        .modal-box p { font-size: 15px; color: #a8b2d1; margin-bottom: 30px; }
        .modal-btn { width: 100%; padding: 12px; background: #1877f2; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .modal-btn:hover { background: #145dbf; }
        .property-img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; background: #1f2937; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">DREAM ESTATES</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="properties.html">Explore Properties</a>
            <a href="my-properties.html" class="active">My Dashboard</a>
            <a href="profile.html">Profile</a>
        </div>
        <div class="nav-right" style="display: flex; align-items: center; gap: 25px;">
            <a href="notifications.html" style="display:flex; align-items:center; color: #cccccc; text-decoration: none; transition: color 0.3s;" title="Notifications">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
            </a>
            <button class="logout-nav-btn" id="logoutBtn">SIGN OUT</button>
        </div>
    </nav>

    <div class="container">
        <div class="top-action-bar">
            <h2>My Dashboard</h2>
            <button class="add-property-toggle-btn" id="openAddModalBtn">+ Add New Property</button>
        </div>

        <div class="list-card">
            <div class="section-title">Manage My Properties</div>
            <div class="property-grid" id="propertyGrid">
                <p style="color: #a8b2d1; text-align: center; margin-top: 40px;">Loading properties...</p>
            </div>
        </div>
    </div>

    <div class="form-modal-overlay" id="addPropertyModal">
        <div class="form-modal-box">
            <button class="close-modal-btn" id="closeAddModalBtn">&times;</button>
            <div class="section-title" id="modalFormTitle">Add New Property</div>
            <form id="propertyForm">
                <input type="hidden" id="propertyId">
                <div class="input-group">
                    <label>Title</label>
                    <input type="text" id="title" required placeholder="Luxury Apartment">
                </div>
                <div class="input-group">
                    <label>Description</label>
                    <textarea id="description" rows="3" required placeholder="3 Bedrooms, Modern Kitchen"></textarea>
                </div>
                <div class="input-group">
                    <label>Price ($)</label>
                    <input type="number" id="price" required placeholder="250000">
                </div>
                <div class="input-group">
                    <label>Location</label>
                    <input type="text" id="location" required placeholder="Colombo 03">
                </div>
                <div class="input-group">
                    <label>Contact Email</label>
                    <input type="email" id="contactEmail" placeholder="owner@example.com">
                </div>
                <div class="input-group">
                    <label>Contact Phone Number</label>
                    <input type="text" id="contactPhone" placeholder="+94 71 234 5678">
                </div>
                <div class="input-group">
                    <label>Property Image</label>
                    <input type="file" id="image" accept="image/*">
                </div>
                <button type="submit" class="submit-btn" id="formSubmitBtn">Publish Property</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <div class="modal-icon" id="modalIcon">✓</div>
            <h4 id="modalTitle">Success!</h4>
            <p id="modalMessage">Operation successful.</p>
            <button class="modal-btn" id="modalOkBtn">OK</button>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <div class="modal-icon error" id="confirmModalIcon">?</div>
            <h4 id="confirmModalTitle">Are you sure?</h4>
            <p id="confirmModalMessage">Do you really want to delete this property?</p>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="modal-btn" id="confirmCancelBtn" style="background: #4b5563;">Cancel</button>
                <button class="modal-btn" id="confirmOkBtn" style="background: #e53e3e;">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script>
        const addModal = document.getElementById('addPropertyModal');
        // Property Service එක run වන නිවැරදි Port එක (8082) මෙහි යොදා ඇත
        const API_BASE_URL = 'http://localhost:8082/api/properties';

        document.getElementById('openAddModalBtn').addEventListener('click', () => {
            document.getElementById('propertyForm').reset();
            document.getElementById('propertyId').value = '';
            document.getElementById('modalFormTitle').innerText = 'Add New Property';
            document.getElementById('formSubmitBtn').innerText = 'Publish Property';
            addModal.classList.add('active');
        });

        document.getElementById('closeAddModalBtn').addEventListener('click', () => {
            addModal.classList.remove('active');
        });

        function showPopup(type, title, message, callback) {
            const modal = document.getElementById('customModal');
            const icon = document.getElementById('modalIcon');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            icon.className = 'modal-icon ' + type;
            icon.innerText = type === 'success' ? '✓' : '✕';
            modal.classList.add('active');
            const okBtn = document.getElementById('modalOkBtn');
            const newOkBtn = okBtn.cloneNode(true);
            okBtn.parentNode.replaceChild(newOkBtn, okBtn);
            newOkBtn.addEventListener('click', () => {
                modal.classList.remove('active');
                if (callback) callback();
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchMyProperties();
        });

        async function fetchMyProperties() {
            const grid = document.getElementById('propertyGrid');
            try {
                const response = await fetch(API_BASE_URL, {
                    method: 'GET'
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    let properties = [];
                    if (Array.isArray(data)) {
                        properties = data;
                    } else if (data && Array.isArray(data.content)) {
                        properties = data.content;
                    } else if (data) {
                        properties = [data];
                    }

                    if (properties.length === 0) {
                        grid.innerHTML = '<p style="color: #a8b2d1; text-align: center; margin-top: 40px;">You have not published any properties yet.</p>';
                        return;
                    }

                    let html = '';
                    properties.forEach(p => {
                        let contactHtml = '';
                        if (p.contactEmail || p.contactPhone) {
                            contactHtml = `<div class="property-contacts">`;
                            if (p.contactEmail) contactHtml += `<span>✉ <strong>Email:</strong> ${p.contactEmail}</span>`;
                            if (p.contactPhone) contactHtml += `<span>📞 <strong>Phone:</strong> ${p.contactPhone}</span>`;
                            contactHtml += `</div>`;
                        }

                        let imageHtml = p.imageUrl 
                            ? `http://localhost:8082/api/properties/uploads/${p.imageUrl}` 
                            : '';

                        const propId = p.id || p._id;
                        const priceVal = p.price ? p.price.toLocaleString() : '0';

                        html += `
                            <div class="property-item">
                                ${imageHtml ? `<img src="${imageHtml}" class="property-img" alt="${p.title}">` : `<div class="property-img" style="display:flex;align-items:center;justify-content:center;color:#a8b2d1;">No Image</div>`}
                                <h4>${p.title || 'Untitled'}</h4>
                                <p>${p.description || ''}</p>
                                <p>📍 <strong>Location:</strong> ${p.location || 'N/A'}</p>
                                <div class="property-price">$${priceVal}</div>
                                ${contactHtml}
                                <div class="property-actions">
                                    <button class="edit-btn" onclick="openEditModal('${propId}', '${escapeHtml(p.title)}', '${escapeHtml(p.description)}', ${p.price || 0}, '${escapeHtml(p.location)}', '${p.contactEmail || ''}', '${p.contactPhone || ''}')">Edit</button>
                                    <button class="delete-btn" onclick="deleteProperty('${propId}')">Delete</button>
                                </div>
                            </div>
                        `;
                    });
                    grid.innerHTML = html;
                } else {
                    grid.innerHTML = '<p style="color: #e53e3e; text-align: center; margin-top: 40px;">Failed to load properties.</p>';
                }
            } catch (error) {
                grid.innerHTML = '<p style="color: #e53e3e; text-align: center; margin-top: 40px;">Connection error to server.</p>';
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        window.openEditModal = function(id, title, description, price, location, email, phone) {
            document.getElementById('propertyId').value = id;
            document.getElementById('title').value = title;
            document.getElementById('description').value = description;
            document.getElementById('price').value = price;
            document.getElementById('location').value = location;
            document.getElementById('contactEmail').value = email !== 'undefined' ? email : '';
            document.getElementById('contactPhone').value = phone !== 'undefined' ? phone : '';
            document.getElementById('image').value = '';
            document.getElementById('modalFormTitle').innerText = 'Edit Property';
            document.getElementById('formSubmitBtn').innerText = 'Update Property';
            addModal.classList.add('active');
        }

        document.getElementById('propertyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const propertyId = document.getElementById('propertyId').value;
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('price', document.getElementById('price').value);
            formData.append('location', document.getElementById('location').value);
            formData.append('contactEmail', document.getElementById('contactEmail').value);
            formData.append('contactPhone', document.getElementById('contactPhone').value);
            formData.append('ownerId', localStorage.getItem('userId') || 'user123');

            const imageFile = document.getElementById('image').files[0];
            if (imageFile) {
                formData.append('image', imageFile);
            }

            const isEdit = propertyId && propertyId !== '';
            const url = isEdit ? `${API_BASE_URL}/${propertyId}` : API_BASE_URL;
            const method = isEdit ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    body: formData
                });

                if (response.ok) {
                    addModal.classList.remove('active');
                    const successMsg = isEdit ? 'Property updated successfully!' : 'Property published successfully!';
                    showPopup('success', 'Success!', successMsg, () => {
                        document.getElementById('propertyForm').reset();
                        document.getElementById('propertyId').value = '';
                        fetchMyProperties();
                    });
                } else {
                    showPopup('error', 'Failed', 'Could not save property.');
                }
            } catch (error) {
                showPopup('error', 'Connection Error', 'Could not connect to server.');
            }
        });

        window.deleteProperty = function(id) {
            const confirmModal = document.getElementById('confirmModal');
            confirmModal.classList.add('active');
            const okBtn = document.getElementById('confirmOkBtn');
            const cancelBtn = document.getElementById('confirmCancelBtn');
            const newOkBtn = okBtn.cloneNode(true);
            okBtn.parentNode.replaceChild(newOkBtn, okBtn);
            const newCancelBtn = cancelBtn.cloneNode(true);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            newOkBtn.addEventListener('click', async () => {
                confirmModal.classList.remove('active');
                try {
                    const response = await fetch(`${API_BASE_URL}/${id}`, {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        showPopup('success', 'Deleted!', 'Property deleted successfully.', () => {
                            fetchMyProperties();
                        });
                    } else {
                        showPopup('error', 'Failed', 'Could not delete property.');
                    }
                } catch (error) {
                    showPopup('error', 'Connection Error', 'Could not connect to server.');
                }
            });

            newCancelBtn.addEventListener('click', () => {
                confirmModal.classList.remove('active');
            });
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
