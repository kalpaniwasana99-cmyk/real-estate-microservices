<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Dream Estates</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }
        body { background-color: #060f26; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        
        nav { width: 100%; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; background: #0b1221; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 100; }
        .logo { font-size: 24px; font-weight: 700; color: #ffffff; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: #cccccc; text-decoration: none; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .nav-links a.active, .nav-links a:hover { color: #ffd700; }
        .logout-nav-btn { padding: 8px 20px; background: transparent; color: #e53e3e; border: 1px solid #e53e3e; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .logout-nav-btn:hover { background: #e53e3e; color: white; }
        
        .profile-header-section { background: linear-gradient(135deg, #0b1221, #060f26); padding: 80px 50px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 40px; position: relative; overflow: hidden; }
        .profile-header-section::before { content: ''; position: absolute; left: 50px; top: 0; width: 4px; height: 100%; background-color: #ffd700; }
        .avatar { width: 120px; height: 120px; background: rgba(24, 119, 242, 0.1); border: 2px solid #1877f2; color: #1877f2; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 45px; font-weight: 700; margin-left: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .profile-title { flex: 1; }
        .profile-title h5 { color: #ffd700; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .profile-title h1 { font-size: 40px; font-weight: 700; line-height: 1.2; text-transform: uppercase; }
        .profile-title p { color: #a8b2d1; font-size: 16px; margin-top: 5px; }
        
        .profile-content-section { padding: 60px 50px; flex-grow: 1; display: flex; justify-content: center; }
        .form-card { background: #0b1221; width: 100%; max-width: 800px; padding: 40px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        .section-title { font-size: 18px; font-weight: 600; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 30px; border-left: 3px solid #1877f2; padding-left: 15px; }
        
        /* Grid Layouts for both View and Edit modes */
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .data-group { display: flex; flex-direction: column; }
        .data-group.full-width { grid-column: span 2; }
        .data-group label { margin-bottom: 8px; color: #a8b2d1; font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
        
        /* View Mode Text Styles */
        .data-group p { color: #ffffff; font-size: 15px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); word-break: break-all; }
        
        /* Edit Mode Input Styles */
        .data-group input { padding: 14px 20px; border: 1px solid #1f2937; border-radius: 8px; font-size: 15px; outline: none; background-color: #111b33; color: white; transition: all 0.3s ease; }
        .data-group input:focus { border-color: #ffd700; box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1); }
        
        .action-buttons { display: flex; justify-content: flex-end; gap: 15px; margin-top: 40px; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); }
        
        /* Buttons */
        .btn-primary { padding: 14px 30px; background: #1877f2; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .btn-primary:hover { background: #145dbf; }
        .btn-secondary { padding: 14px 30px; background: #1f2937; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .btn-secondary:hover { background: #374151; }
        .btn-danger { padding: 14px 30px; background: rgba(229, 62, 62, 0.1); color: #e53e3e; border: 1px solid #e53e3e; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .btn-danger:hover { background: #e53e3e; color: white; }

        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: #111b33; width: 400px; padding: 40px 30px; border-radius: 20px; text-align: center; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); transform: scale(0.8); transition: transform 0.3s; border: 1px solid rgba(255,255,255,0.1); }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-icon { width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 35px; margin: 0 auto 20px auto; font-weight: 700; }
        .modal-icon.success { background: rgba(52, 168, 83, 0.1); color: #34a853; border: 2px solid #34a853; }
        .modal-icon.error { background: rgba(211, 47, 47, 0.1); color: #d32f2f; border: 2px solid #d32f2f; }
        .modal-icon.warning { background: rgba(251, 192, 45, 0.1); color: #fbc02d; border: 2px solid #fbc02d; }
        .modal-box h4 { font-size: 22px; font-weight: 600; color: #ffffff; margin-bottom: 10px; }
        .modal-box p { font-size: 15px; color: #a8b2d1; margin-bottom: 30px; line-height: 1.5; }
        .modal-btn-group { display: flex; gap: 15px; }
        .modal-btn { flex: 1; padding: 12px; background: #1877f2; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .modal-btn:hover { background: #145dbf; }
        .modal-btn.cancel-btn { background: #1f2937; color: white; }
        .modal-btn.cancel-btn:hover { background: #374151; }

        @media (max-width: 768px) {
            .data-grid { grid-template-columns: 1fr; }
            .data-group.full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">DREAM ESTATES</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            
            <a href="properties.html">Explore Properties</a>
            <a href="my-properties.html">My Dashboard</a>
            <a href="profile.html" class="active">Profile</a>
        </div>
        <button class="logout-nav-btn" id="logoutBtn">SIGN OUT</button>
    </nav>

    <div class="profile-header-section">
        <div class="avatar" id="userAvatar">U</div>
        <div class="profile-title">
            <h5>Member Profile</h5>
            <h1 id="headerName">Loading...</h1>
            <p id="headerEmail">Please wait...</p>
        </div>
    </div>

    <div class="profile-content-section">
        <div class="form-card">
            <div class="section-title">Personal Information</div>

            <!-- VIEW MODE (Displays Data Only) -->
            <div id="viewMode">
                <div class="data-grid">
                    <div class="data-group">
                        <label>First Name</label>
                        <p id="viewFirstName">-</p>
                    </div>
                    <div class="data-group">
                        <label>Last Name</label>
                        <p id="viewLastName">-</p>
                    </div>
                    <div class="data-group full-width">
                        <label>Email Address</label>
                        <p id="viewEmail">-</p>
                    </div>
                    <div class="data-group">
                        <label>Phone Number</label>
                        <p id="viewPhone">-</p>
                    </div>
                    <div class="data-group">
                        <label>Address</label>
                        <p id="viewAddress">-</p>
                    </div>
                </div>
                <div class="action-buttons">
                    <button type="button" class="btn-primary" id="openEditBtn">Edit Profile</button>
                </div>
            </div>

            <!-- EDIT MODE (Form to Update Data) -->
            <form id="editForm" style="display: none;">
                <div class="data-grid">
                    <div class="data-group">
                        <label>First Name</label>
                        <input type="text" id="firstName" required>
                    </div>
                    <div class="data-group">
                        <label>Last Name</label>
                        <input type="text" id="lastName" required>
                    </div>
                    <div class="data-group full-width">
                        <label>Email Address</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="data-group">
                        <label>Phone Number</label>
                        <input type="text" id="phone" placeholder="+94 7X XXX XXXX">
                    </div>
                    <div class="data-group">
                        <label>Address</label>
                        <input type="text" id="address" placeholder="123, Main Street, Colombo">
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button type="button" class="btn-danger" id="deleteBtn">Delete Account</button>
                    <button type="button" class="btn-secondary" id="cancelEditBtn">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>

        </div>
    </div>

    <!-- Custom Popup Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <div class="modal-icon" id="modalIcon">✓</div>
            <h4 id="modalTitle">Success!</h4>
            <p id="modalMessage">Operation successful.</p>
            <div class="modal-btn-group" id="modalBtnGroup"></div>
        </div>
    </div>

    <script>
        // Toggle Between View and Edit Modes
        const viewMode = document.getElementById('viewMode');
        const editForm = document.getElementById('editForm');
        
        document.getElementById('openEditBtn').addEventListener('click', () => {
            viewMode.style.display = 'none';
            editForm.style.display = 'block';
        });

        document.getElementById('cancelEditBtn').addEventListener('click', () => {
            editForm.style.display = 'none';
            viewMode.style.display = 'block';
        });

        // Popup Logic
        function showPopup(type, title, message, onOk, showCancel = false) {
            const modal = document.getElementById('customModal');
            const icon = document.getElementById('modalIcon');
            const btnGroup = document.getElementById('modalBtnGroup');
            
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            
            icon.className = 'modal-icon ' + type;
            if (type === 'success') icon.innerText = '✓';
            else if (type === 'error') icon.innerText = '✕';
            else if (type === 'warning') icon.innerText = '!';

            btnGroup.innerHTML = ''; 
            
            if (showCancel) {
                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'modal-btn cancel-btn';
                cancelBtn.innerText = 'Cancel';
                cancelBtn.onclick = () => modal.classList.remove('active');
                btnGroup.appendChild(cancelBtn);
            }

            const okBtn = document.createElement('button');
            okBtn.className = 'modal-btn';
            okBtn.innerText = showCancel ? 'Confirm Delete' : 'OK';
            okBtn.onclick = () => {
                modal.classList.remove('active');
                if (onOk) onOk();
            };
            btnGroup.appendChild(okBtn);

            modal.classList.add('active');
        }

        // Fetch Data on Load
        window.addEventListener('DOMContentLoaded', async () => {
            const userId = localStorage.getItem('userId');
            const token = localStorage.getItem('authToken');
            
            if (!userId || userId === 'null' || userId === 'undefined') {
                window.location.href = 'index.html';
                return;
            }

            try {
                const response = await fetch(`http://localhost:8080/auth/users/${userId}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const user = await response.json();
                    
                    // Set Data in View Mode
                    document.getElementById('viewFirstName').innerText = user.firstName || '-';
                    document.getElementById('viewLastName').innerText = user.lastName || '-';
                    document.getElementById('viewEmail').innerText = user.email || '-';
                    document.getElementById('viewPhone').innerText = user.phone || 'Not Provided';
                    document.getElementById('viewAddress').innerText = user.address || 'Not Provided';

                    // Set Data in Edit Form
                    document.getElementById('firstName').value = user.firstName || '';
                    document.getElementById('lastName').value = user.lastName || '';
                    document.getElementById('email').value = user.email || '';
                    document.getElementById('phone').value = user.phone || '';      
                    document.getElementById('address').value = user.address || '';   
                    
                    // Set Header Info
                    const fullName = `${user.firstName || ''} ${user.lastName || ''}`.trim();
                    document.getElementById('headerName').innerText = fullName || 'USER ACCOUNT';
                    document.getElementById('headerEmail').innerText = user.email || '';
                    if(user.firstName) {
                        document.getElementById('userAvatar').innerText = user.firstName.charAt(0).toUpperCase();
                    }
                }
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        });

        // Update Data Form Submit
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = localStorage.getItem('userId');
            const token = localStorage.getItem('authToken');

            const updatedData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,      
                address: document.getElementById('address').value   
            };

            try {
                const response = await fetch(`http://localhost:8080/auth/users/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(updatedData)
                });

                if (response.ok) {
                    showPopup('success', 'Success!', 'Profile updated successfully!', () => {
                        // Update Header
                        document.getElementById('headerName').innerText = `${updatedData.firstName} ${updatedData.lastName}`.toUpperCase();
                        document.getElementById('headerEmail').innerText = updatedData.email;
                        if(updatedData.firstName) document.getElementById('userAvatar').innerText = updatedData.firstName.charAt(0).toUpperCase();
                        
                        // Update View Mode Data
                        document.getElementById('viewFirstName').innerText = updatedData.firstName;
                        document.getElementById('viewLastName').innerText = updatedData.lastName;
                        document.getElementById('viewEmail').innerText = updatedData.email;
                        document.getElementById('viewPhone').innerText = updatedData.phone || 'Not Provided';
                        document.getElementById('viewAddress').innerText = updatedData.address || 'Not Provided';

                        // Switch back to view mode
                        editForm.style.display = 'none';
                        viewMode.style.display = 'block';
                    });
                } else {
                    showPopup('error', 'Update Failed', 'Could not update profile information.');
                }
            } catch (error) {
                showPopup('error', 'Connection Error', 'Could not connect to server.');
            }
        });

        // Delete Account
        document.getElementById('deleteBtn').addEventListener('click', () => {
            showPopup('warning', 'Are you sure?', 'Do you really want to delete your account? This action cannot be undone.', async () => {
                const userId = localStorage.getItem('userId');
                const token = localStorage.getItem('authToken');

                try {
                    const response = await fetch(`http://localhost:8080/auth/users/${userId}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (response.ok) {
                        showPopup('success', 'Deleted!', 'Account deleted successfully.', () => {
                            localStorage.clear();
                            window.location.href = 'index.html';
                        });
                    } else {
                        showPopup('error', 'Error', 'Failed to delete account.');
                    }
                } catch (error) {
                    showPopup('error', 'Connection Error', 'Could not connect to server.');
                }
            }, true);
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
