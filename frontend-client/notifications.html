<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications & Messages - Dream Estates</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }
        body { background-color: #060f26; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        nav { width: 100%; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; background: #0b1221; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 100; }
        .logo { font-size: 24px; font-weight: 700; color: #ffffff; }
        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a { color: #cccccc; text-decoration: none; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .nav-links a:hover { color: #ffd700; }
        .logout-nav-btn { padding: 8px 20px; background: transparent; color: #e53e3e; border: 1px solid #e53e3e; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .logout-nav-btn:hover { background: #e53e3e; color: white; }

        .container { padding: 40px 50px; max-width: 900px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 20px; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: #0b1221; color: #ffffff; text-decoration: none; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); font-size: 14px; font-weight: 500; transition: background 0.3s; width: fit-content; }
        .back-btn:hover { background: #111b33; }

        .inbox-card { background: #0b1221; padding: 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 15px 35px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 20px; }
        .section-title { font-size: 18px; font-weight: 600; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; border-left: 3px solid #1877f2; padding-left: 15px; }

        .tab-group { display: flex; gap: 15px; }
        .tab-btn { padding: 8px 20px; background: #111b33; color: #a8b2d1; border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .tab-btn.active { background: #1877f2; color: white; }

        .messages-list { display: flex; flex-direction: column; gap: 15px; max-height: 500px; overflow-y: auto; padding-right: 5px; }
        .message-item { background: #111b33; padding: 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 8px; }
        .message-header { display: flex; justify-content: space-between; font-size: 13px; color: #ffd700; }
        .message-body { font-size: 14px; color: #ffffff; line-height: 1.5; }
        .message-footer { font-size: 12px; color: #a8b2d1; margin-top: 5px; }

        .send-action-bar { display: flex; justify-content: flex-end; margin-top: 10px; }
        .send-msg-btn { padding: 12px 25px; background: #1877f2; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .send-msg-btn:hover { background: #145dbf; }

        .msg-actions { display: flex; gap: 10px; margin-top: 10px; }
        .btn-reply { padding: 6px 15px; background: #1877f2; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .btn-reply:hover { background: #145dbf; }
        .btn-delete { padding: 6px 15px; background: #e53e3e; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .btn-delete:hover { background: #c53030; }
        
        .reply-box { margin-top: 12px; display: none; flex-direction: column; gap: 8px; background: #060f26; padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .reply-box textarea { padding: 10px; border-radius: 6px; border: 1px solid #1f2937; background: #111b33; color: white; font-size: 13px; outline: none; resize: vertical; }
        .reply-box button { align-self: flex-end; padding: 8px 20px; background: #34a853; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .reply-box button:hover { background: #2b8c44; }

        /* Custom Modal Styles */
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .custom-modal-overlay.active { opacity: 1; visibility: visible; }
        .custom-modal-box { background: #0b1221; width: 400px; padding: 35px; border-radius: 20px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); transform: scale(0.8); transition: transform 0.3s; border: 1px solid rgba(255,255,255,0.1); }
        .custom-modal-overlay.active .custom-modal-box { transform: scale(1); }
        .custom-modal-icon { font-size: 35px; margin-bottom: 15px; }
        .custom-modal-box h4 { font-size: 20px; color: #ffffff; margin-bottom: 10px; }
        .custom-modal-box p { font-size: 14px; color: #a8b2d1; margin-bottom: 25px; }
        .custom-modal-btns { display: flex; gap: 10px; }
        .modal-action-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; transition: background 0.3s; }
        .btn-confirm-yes { background: #e53e3e; color: white; }
        .btn-confirm-yes:hover { background: #c53030; }
        .btn-confirm-no { background: #4b5563; color: white; }
        .btn-confirm-no:hover { background: #374151; }
        .btn-ok { background: #1877f2; color: white; width: 100%; }
        .btn-ok:hover { background: #145dbf; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">DREAM ESTATES</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="properties.html">Explore Properties</a>
            <a href="my-properties.html">My Dashboard</a>
            <a href="profile.html">Profile</a>
        </div>
        <button class="logout-nav-btn" id="logoutBtn">SIGN OUT</button>
    </nav>

    <div class="container">
        <a href="payment-inquiry.html" class="back-btn">&larr; Back to Inquiry & Payment</a>

        <div class="inbox-card">
            <div class="section-title">Inbox & Notifications</div>
            <div class="tab-group">
                <button class="tab-btn active" id="receivedTab">RECEIVED</button>
                <button class="tab-btn" id="sentTab">SENT</button>
            </div>

            <div class="messages-list" id="messagesContainer">
                <p style="color: #a8b2d1; text-align: center; margin-top: 20px;">Loading messages...</p>
            </div>
        </div>

        <div class="send-action-bar">
            <button class="send-msg-btn" onclick="window.location.href='payment-inquiry.html'">+ Send New Inquiry / Message</button>
        </div>
    </div>

    <!-- Custom Modal Structure -->
    <div class="custom-modal-overlay" id="appModal">
        <div class="custom-modal-box">
            <div class="custom-modal-icon" id="modalIcon">⚠️</div>
            <h4 id="modalTitle">Are you sure?</h4>
            <p id="modalMessage">Do you want to proceed?</p>
            <div class="custom-modal-btns" id="modalButtons">
                <button class="modal-action-btn btn-confirm-no" id="modalCancelBtn">Cancel</button>
                <button class="modal-action-btn btn-confirm-yes" id="modalYesBtn">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script>
        const NOTIFICATION_API_BASE = 'http://localhost:8084/api/notify';

        let userEmail = localStorage.getItem('userEmail');
        if (!userEmail || userEmail === 'null') {
            userEmail = 'dahami@gmail.com';
            localStorage.setItem('userEmail', userEmail);
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadMessages('received');
        });

        document.getElementById('receivedTab').addEventListener('click', () => {
            document.getElementById('receivedTab').classList.add('active');
            document.getElementById('sentTab').classList.remove('active');
            loadMessages('received');
        });

        document.getElementById('sentTab').addEventListener('click', () => {
            document.getElementById('sentTab').classList.add('active');
            document.getElementById('receivedTab').classList.remove('active');
            loadMessages('sent');
        });

        function showCustomModal(title, message, isConfirm, onYesCallback) {
            const modal = document.getElementById('appModal');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            const btnGroup = document.getElementById('modalButtons');

            if (isConfirm) {
                btnGroup.innerHTML = `
                    <button class="modal-action-btn btn-confirm-no" id="modalCancelBtn">Cancel</button>
                    <button class="modal-action-btn btn-confirm-yes" id="modalYesBtn">Yes, Delete</button>
                `;
                document.getElementById('modalCancelBtn').onclick = () => modal.classList.remove('active');
                document.getElementById('modalYesBtn').onclick = () => {
                    modal.classList.remove('active');
                    if (onYesCallback) onYesCallback();
                };
            } else {
                btnGroup.innerHTML = `<button class="modal-action-btn btn-ok" id="modalOkBtn">OK</button>`;
                document.getElementById('modalOkBtn').onclick = () => modal.classList.remove('active');
            }
            modal.classList.add('active');
        }

        async function loadMessages(type) {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '<p style="color: #a8b2d1; text-align: center; margin-top: 20px;">Loading messages...</p>';

            const endpoint = type === 'received' 
                ? `${NOTIFICATION_API_BASE}/inbox/received/${userEmail}` 
                : `${NOTIFICATION_API_BASE}/inbox/sent/${userEmail}`;

            try {
                const response = await fetch(endpoint, { 
                    method: 'GET',
                    headers: {
                        'X-API-KEY': 'notify-service-secret-key-123',
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    const messages = Array.isArray(data) ? data : (data.content || []);

                    if (messages.length === 0) {
                        container.innerHTML = '<p style="color: #a8b2d1; text-align: center; margin-top: 20px;">No messages found.</p>';
                        return;
                    }

                    let html = '';
                    messages.forEach(m => {
                        const msgId = m.id || m._id;
                        html += `
                            <div class="message-item" id="msg-${msgId}">
                                <div class="message-header">
                                    <span><strong>Subject:</strong> ${m.subject || 'Notification'}</span>
                                    <span>${m.timestamp ? m.timestamp.substring(0, 10) : ''}</span>
                                </div>
                                <div class="message-body">${m.body || m.message || ''}</div>
                                <div class="message-footer">From: ${m.senderEmail || 'System'} | To: ${m.toEmail || userEmail}</div>
                                
                                <div class="msg-actions">
                                    <button class="btn-reply" onclick="toggleReplyBox('${msgId}')">Reply</button>
                                    <button class="btn-delete" onclick="deleteNotification('${msgId}')">Delete</button>
                                </div>

                                <div class="reply-box" id="reply-box-${msgId}">
                                    <textarea id="reply-text-${msgId}" rows="2" placeholder="Type your reply here..."></textarea>
                                    <button onclick="sendReply('${msgId}')">Send Reply</button>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p style="color: #a8b2d1; text-align: center; margin-top: 20px;">No messages found.</p>';
                }
            } catch (error) {
                container.innerHTML = '<p style="color: #a8b2d1; text-align: center; margin-top: 20px;">Connection error to notification service.</p>';
            }
        }

        function toggleReplyBox(id) {
            const box = document.getElementById(`reply-box-${id}`);
            box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
        }

        async function sendReply(id) {
            const replyContent = document.getElementById(`reply-text-${id}`).value;
            if (!replyContent.trim()) {
                showCustomModal('Warning', 'Please type a reply message.', false);
                return;
            }

            try {
                const response = await fetch(`${NOTIFICATION_API_BASE}/${id}/reply`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-KEY': 'notify-service-secret-key-123'
                    },
                    body: JSON.stringify({ replyMessage: replyContent })
                });

                if (response.ok) {
                    showCustomModal('Success', 'Reply sent successfully!', false);
                    loadMessages(document.getElementById('receivedTab').classList.contains('active') ? 'received' : 'sent');
                } else {
                    showCustomModal('Failed', 'Failed to send reply.', false);
                }
            } catch (error) {
                showCustomModal('Error', 'Connection error.', false);
            }
        }

        function deleteNotification(id) {
            showCustomModal('Confirm Delete', 'Are you sure you want to delete this notification?', true, async () => {
                try {
                    const response = await fetch(`${NOTIFICATION_API_BASE}/${id}`, {
                        method: 'DELETE',
                        headers: {
                            'X-API-KEY': 'notify-service-secret-key-123'
                        }
                    });

                    if (response.ok) {
                        const elem = document.getElementById(`msg-${id}`);
                        if (elem) elem.remove();
                    } else {
                        showCustomModal('Failed', 'Failed to delete notification.', false);
                    }
                } catch (error) {
                    showCustomModal('Error', 'Connection error.', false);
                }
            });
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
